name: Recover LexyCorpus Qwen runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-lexycorpus-qwen.yml

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Configure Hetzner SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -eu
          test -n "$SSH_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 37.27.49.209 > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Start and verify Qwen3-Embedding-8B
        shell: bash
        run: |
          set -eu
          ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=4 -i ~/.ssh/id_ed25519 root@37.27.49.209 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          unit=lexycorpus-qwen3-8b-backfill-v4.service
          status=/opt/lexycorpus/runs/embedding-backfill-qwen3-8b-v4-r1/status.json

          echo "== CONTRACT =="
          grep -Fq 'MODEL = "Qwen/Qwen3-Embedding-8B"' /opt/lexycorpus/bin/embedding_backfill_qwen_v4.py
          grep -Fq 'DIMENSIONS = 4096' /opt/lexycorpus/bin/embedding_backfill_qwen_v4.py
          python3 - "$status" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          assert d.get("model") == "Qwen/Qwen3-Embedding-8B"
          assert d.get("dimensions") == 4096
          assert d.get("vector_artifact_version") == "lexycorpus-embedding-shard-v4-qwen3-8b-int8"
          print("QWEN_STATUS_IDENTITY_VERIFIED")
          print(json.dumps({k:d.get(k) for k in ("status","model","dimensions","completed_partitions","completed_chunks","current_batch","updated_at")}, sort_keys=True))
          PY

          echo "== START =="
          systemctl reset-failed "$unit" || true
          systemctl start --no-block "$unit"
          sleep 30
          state=$(systemctl is-active "$unit" || true)
          echo "QWEN_SERVICE_ACTIVE=$state"
          systemctl show "$unit" --no-pager -p ActiveState -p SubState -p Result -p MainPID
          test "$state" = activating -o "$state" = active
          ps -eo pid,args | grep '[e]mbedding_backfill_qwen_v4.py' |
            grep -F -- '--embedding-model Qwen/Qwen3-Embedding-8B' |
            grep -F -- '--embedding-endpoint http://100.121.19.14:18102/v1/embeddings' |
            sed -E 's/(--api-key[ =])[^ ]+/\1REDACTED/Ig'

          echo "== PERPLEXITY OFF =="
          for old in lexycorpus-pplx4b-backfill-v2.service lexycorpus-pplx4b-backfill-v3.service lexycorpus-statutes-pplx4b-backfill-v3.service; do
            systemctl disable "$old" 2>/dev/null || true
            test "$(systemctl is-active "$old" || true)" != active
            echo "$old ACTIVE=$(systemctl is-active "$old" || true) ENABLED=$(systemctl is-enabled "$old" || true)"
          done

          echo "== QWEN HEARTBEAT =="
          python3 - "$status" <<'PY'
          import json, pathlib, sys
          d=json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(json.dumps({k:d.get(k) for k in ("status","model","dimensions","completed_partitions","completed_chunks","current_partition","current_batch","next_batch","updated_at")}, sort_keys=True))
          PY
          df -h /
          REMOTE
