name: Inspect LexyCorpus embedding runtime

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-lexycorpus-runtime.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure production SSH
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST != '' && vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT != '' && vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS != '' && vars.DEPLOY_KNOWN_HOSTS || secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        shell: bash
        run: |
          set -eu
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_SSH_KEY"
          port="${DEPLOY_PORT:-22}"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            ssh-keyscan -p "$port" "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          fi
          chmod 644 ~/.ssh/known_hosts

      - name: Inspect runtime without exposing credentials
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST != '' && vars.DEPLOY_HOST || secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT != '' && vars.DEPLOY_PORT || secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER != '' && vars.DEPLOY_USER || secrets.DEPLOY_USER }}
        shell: bash
        run: |
          set -eu
          port="${DEPLOY_PORT:-22}"
          ssh -i ~/.ssh/id_ed25519 -p "$port" "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' <<'REMOTE'
          set -u
          echo "== host =="
          hostname
          id
          date -u
          uptime
          df -h /
          free -h || true

          echo "== matching systemd units =="
          systemctl list-units --all --no-pager --plain 2>/dev/null |
            grep -Ei 'lexy|corpus|embed|qwen|pplx|perplex|vllm|text.embedd' || true

          echo "== matching processes =="
          pids="$(pgrep -f 'corpus-embedding-backfill|embedding_backfill|qwen|pplx|perplex|vllm|text.embedd' || true)"
          for pid in $pids; do
            [ -r "/proc/$pid/cmdline" ] || continue
            printf 'PID=%s EXE=' "$pid"
            readlink "/proc/$pid/exe" 2>/dev/null || true
            printf 'CWD='
            readlink "/proc/$pid/cwd" 2>/dev/null || true
            printf 'CMD='
            tr '\0' ' ' < "/proc/$pid/cmdline" |
              sed -E 's/(--[^ ]*(key|token|secret)[^ ]*) [^ ]+/\1 REDACTED/Ig; s/(Bearer )[A-Za-z0-9._~+\/-]+/\1REDACTED/Ig'
            echo
            printf 'ENV_KEYS='
            tr '\0' '\n' < "/proc/$pid/environ" 2>/dev/null |
              cut -d= -f1 |
              grep -Ei 'lexy|corpus|embed|qwen|pplx|perplex|cloudflare|access|storage|ssh' |
              paste -sd, - || true
            echo
            printf 'CGROUP='
            tr '\n' ';' < "/proc/$pid/cgroup" 2>/dev/null || true
            echo
          done

          echo "== matching containers =="
          docker ps -a --format '{{.Names}}|{{.Image}}|{{.Status}}' 2>/dev/null |
            grep -Ei 'lexy|corpus|embed|qwen|pplx|perplex|vllm|meili|typesense' || true

          echo "== candidate runtime files =="
          find /srv /opt /var/lib /etc/systemd/system /root \
            -maxdepth 6 -type f \
            \( -iname '*embedding*' -o -iname '*lexycorpus*' -o -iname '*qwen*' -o -iname '*pplx*' \) \
            2>/dev/null | sort | head -400

          echo "== sanitized status journals =="
          find /srv /opt /var/lib /root -maxdepth 8 -type f \
            \( -iname '*embedding*status*.json' -o -iname 'embedding-status.json' \) 2>/dev/null |
          while IFS= read -r status; do
            echo "STATUS_FILE=$status"
            python3 - "$status" <<'PY'
          import json, pathlib, sys
          path = pathlib.Path(sys.argv[1])
          try:
              value = json.loads(path.read_text())
          except Exception as exc:
              print("UNREADABLE", type(exc).__name__)
              raise SystemExit(0)
          allowed = {
              "updated_at", "status", "model", "profile", "dimensions", "batch_size",
              "vector_artifact_version", "vector_projection_schema", "input_tokens",
              "local_input_tokens", "estimated_cost_usd", "completed_partitions",
              "completed_chunks", "partition_position", "partition_count",
              "current_partition", "current_batch", "next_partition", "next_batch",
              "active_embedding_provider", "request_concurrency", "run_elapsed_seconds",
              "run_chunks_per_second", "embedding_attempts", "embedding_retries",
              "embedding_failures",
          }
          print(json.dumps({key: value.get(key) for key in sorted(allowed) if key in value}, indent=2))
          PY
          done

          echo "== repository checkouts =="
          find /srv /opt /root -maxdepth 6 -type d -name .git 2>/dev/null |
          while IFS= read -r dotgit; do
            repo="${dotgit%/.git}"
            printf '%s|' "$repo"
            git -C "$repo" branch --show-current 2>/dev/null || true
            git -C "$repo" rev-parse HEAD 2>/dev/null || true
          done

          echo "== endpoint status =="
          curl --silent --show-error --output /dev/null --write-out 'embed.esq2u.com HTTP %{http_code}\n'             https://embed.esq2u.com/v1/models || true
          REMOTE
