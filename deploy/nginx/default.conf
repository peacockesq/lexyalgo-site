server {
    listen 3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Permanent case/statute/constitution URLs all render through the live
    # authority shell. The browser keeps the requested canonical URL while the
    # shell resolves it through the LexyCorpus path contract.
    location ~ ^/corpus/(cases|statutes|constitutions)/ {
        try_files $uri $uri.html $uri/index.html /corpus/live-authority/index.html;
    }

    location / {
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
